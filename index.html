<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="Transforme uma lista de texto em uma playlist do Spotify, com revisão antes de criar."
    />
    <title>Importador de Playlist por Texto</title>
    <!--
      A meta Content-Security-Policy é injetada apenas no build, pelo plugin
      `tp-csp-on-build-only` em vite.config.ts. Não adicione uma aqui: o dev server
      do Vite exigiria `style-src 'unsafe-inline'` e o afrouxamento vazaria para
      produção (research §8).
    -->
    <!--
      Aplica `data-theme` antes da primeira pintura (FR-010). Precisa vir aqui,
      bloqueante e **antes** do `<script type="module">`, que é adiado por
      definição e rodaria depois do primeiro quadro. Arquivo de `public/`, mesma
      origem, sem inline — é a forma que cabe em `script-src 'self'` (research §2).
    -->
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
